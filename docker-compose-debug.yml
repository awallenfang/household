services:
    db:
        image: postgres
        volumes:
            - ./data/db:/var/lib/postgresql/data
        env_file:
            - config.env
        ports:
            - "5432:5432"
    web:
        build: .
        command: python manage.py runserver 0.0.0.0:5000
        volumes:
            - .:/code
        ports:
            - "5000:5000"
        env_file:
            - config.env
        depends_on:
            - db
