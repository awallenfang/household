services:
    db:
        image: postgres:17
        volumes:
            - ./data/db:/var/lib/postgresql/data
        env_file:
            - config.env
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        restart: unless-stopped
        networks:
            - net
    web:
        build: .
        command: bash debug_startup.sh
        environment:
            DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-root.settings}
            DEBUG: ${DEBUG:-True}
        volumes:
            - .:/code
        ports:
            - "5000:5000"
        env_file:
            - config.env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped
        networks:
            - net
    redis:
        image: redis:8.0.2
        restart: always
        ports:
            - '6379:6379'
        command: redis-server --save 20 1 --loglevel warning
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes: 
            - ./data/redis:/data
        networks:
            - net
networks:
  net:
    external: true
