services:
    db:
        image: postgres
        volumes:
            - ./data/db:/var/lib/postgresql/data
        env_file:
            - config.env
        ports:
            - "5432:5432"
    web:
        build: .
        command: bash debug_startup.sh
        volumes:
            - .:/code
        ports:
            - "5000:5000"
        env_file:
            - config.env
        depends_on:
            - db
            - redis
    redis:
        image: redis:8.0.2
        restart: always
        ports:
            - '6379:6379'
        command: redis-server --save 20 1 --loglevel warning
        volumes: 
            - ./redis/cache:/data