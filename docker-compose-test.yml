services:
    db:
        image: postgres
        volumes:
            - ./data/db:/var/lib/postgresql/data
        env_file:
            - config.env
        ports:
            - "5432:5432"
    web:
        build: .
        command: python manage.py test
        volumes:
            - .:/code
        ports:
            - "42069:42069"
        env_file:
            - config.env
        depends_on:
            - db