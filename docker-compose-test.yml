services:
    db:
        image: postgres:17
        volumes:
            - ./data/db-test:/var/lib/postgresql/data
        env_file:
            - config.env
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
    web:
        build: .
        command: bash test_startup.sh
        environment:
            DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-root.settings}
        volumes:
            - .:/code
        ports:
            - "42069:42069"
        env_file:
            - config.env
        depends_on:
            db:
                condition: service_healthy