services:
    db:
        image: postgres
        volumes:
            - ./data/db:/var/lib/postgresql/data
        env_file:
            - config.env
        ports:
            - "5432:5432"
        networks:
            - net
        restart: always
    web:
        build: .
        volumes:
            - ./_logs/supervisor:/var/log/supervisor
            - ./_logs/nginx:/var/log/nginx
            - ./_logs/uwsgi:/var/log/uwsgi
        ports:
            - "5000:5000"
        env_file:
            - config.env
        depends_on:
            - db
        networks:
            - net
        restart: always
networks:
  net:
    external: true
