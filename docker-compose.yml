services:
    db:
        image: postgres:17
        volumes:
            - ./data/db:/var/lib/postgresql/data
        env_file:
            - config.env
        expose:
            - "5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        restart: always
        networks:
          - net
    web:
        build: .
        environment:
            DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-root.prod_settings}
            DEBUG: ${DEBUG:-False}
        volumes:
            - ./_logs/supervisor:/var/log/supervisor
            - ./_logs/nginx:/var/log/nginx
            - ./_logs/uwsgi:/var/log/uwsgi
            - ./_logs/django:/var/log/django
            - ./_logs/celery_beat:/var/log/celery_beat
            - ./_logs/celery_worker:/var/log/celery_worker
        ports:
            - "5000:5000"
        env_file:
            - config.env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - net
            - redis-net
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')\""]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
    redis:
        image: redis:8.0.2
        restart: always
        # Internal only: the app reaches Redis via `redis-net`.
        expose:
            - "6379"
        command: redis-server --save 20 1 --loglevel warning
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes: 
            - ./data/redis:/data
        networks:
            - redis-net
networks:
  net:
    external: true
  redis-net:
    external: false