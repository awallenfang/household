[program:nginx]
command=bash /code/docker/nginx/run_nginx.sh
stdout_logfile=/var/log/nginx/stdout.log
stderr_logfile=/var/log/nginx/stderr.log

[program:uwsgi]
command=bash /code/docker/uwsgi/run_uwsgi.sh
stdout_logfile=/var/log/uwsgi/stdout.log
stderr_logfile=/var/log/uwsgi/stderr.log

[program:celery_worker]
command=bash /code/docker/celery_worker/run_celery.sh
stdout_logfile=/var/log/celery_worker/stdout.log
stderr_logfile=/var/log/celery_worker/stderr.log

[program:celery_beat]
command=bash /code/docker/celery_beat/run_beat.sh
stdout_logfile=/var/log/celery_beat/stdout.log
stderr_logfile=/var/log/celery_beat/stderr.log