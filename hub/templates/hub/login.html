{%extends "hub/base.html" %}


{% load static%}


{% block content %}
     <div id="login-container">
        <div id="login">
            <h1>{% trans 'Login' %}</h1>
            <form method="post" id="login-form">
                {% csrf_token %}
                {%if error_message%}
                    <p id="error-message">{{error_message}}</p>
                {%endif%}
                {{form}}
                <button id="submit" type="submit">Login</button>
            </form>
        </div>
        
        <div id="signup">
            <p>{% trans "Don't have an account?" %} <a href="{% url 'hub:signup' %}">{% trans 'Sign Up' %}</a></p>
        </div>
    </div>
{%endblock content%}
