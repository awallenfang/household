{%extends "hub/base.html" %}


{% load static%}


{% block content %}
    <div id="login-container">
        <div id="login">
            <h1>{% trans 'Sign Up' %}</h1>
            <form action="{% url 'hub:signup' %}" method="post" id="login-form">
                {% csrf_token %}
                {%if error_message%}
                    <p id="error-message">{{error_message}}</p>
                {%endif%}
                {{form}}
                <button type="submit">{% trans 'Sign Up' %}</button>
            </form>
        </div>
        <div id="signup">
            <p>{% trans 'Already have an account?' %} <a href="{% url 'hub:login'%}">{% trans 'Login' %}</a></p>
        </div>
    </div>
{%endblock content%}
