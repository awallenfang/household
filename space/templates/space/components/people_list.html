{% load i18n %}

<div id="people-list">
    <div class="list-group list-group-flush">
        {% for person in joined_people %}
        <div class="list-group-item d-flex align-items-center justify-content-between px-0">
            <div class="d-flex align-items-center gap-2">
                <span class="fw-medium">{{ person.user.username }}</span>
                {% if space.owner == person %}
                    <span class="badge bg-warning-subtle text-warning-emphasis rounded-pill">{% trans 'Owner' %}</span>
                {% endif %}
            </div>
            <div class="d-flex align-items-center gap-2">
                {% if person.user == request.user %}
                    <a href="{% url 'space:leave_space' space.id %}"
                       class="btn btn-outline-danger btn-sm"
                       onclick="return confirm('{% trans 'Are you sure? By leaving as the last person the space and all connected data will be lost!' %}')">
                       <i class="bi bi-box-arrow-right me-1"></i>{% trans 'Leave' %}
                    </a>
                {% elif space.owner == user %}
                    <a hx-delete="{% url 'space:space_view' space.id %}?hxp=kick_person&person_id={{ person.id }}"
                       class="btn btn-outline-danger btn-sm"
                       hx-confirm="{% trans 'Are you sure you want to kick this person from the space?' %}"
                       hx-target="#people-list"
                       hx-swap="outerHTML">
                       <i class="bi bi-x-circle me-1"></i>{% trans 'Kick' %}
                    </a>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
