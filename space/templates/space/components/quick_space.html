{% load i18n %}

<div class="quick-space-container" style="display:none">
    <div class="d-flex flex-column gap-1 p-3" style="max-height: 40vh; overflow-y: auto;">
        {% for space in user_spaces %}
        <div class="d-flex flex-row gap-1">
            {% if selected_space.id == space.id %}
                <img src="{% static 'space/assets/door.svg' %}" alt="Selected Space" style="width: 2rem;">
            {% else %}
                <img src="{% static 'space/assets/door.svg' %}" alt="Select Space" style="width: 2rem; visibility:hidden;">
            {% endif %}
            <form action="{% url 'space:select_space' space.id %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">{{space.name}}</button>
            </form>
            <a href="{% url 'space:space_view' space.id %}">
                <img src="{% static 'space/assets/settings.svg' %}" alt="Settings">
            </a>
        </div>
    
    {% endfor %}
    </div>
    
    <hr>
    <form action="{% url 'space:join_space' %}" method="post" class="d-flex flex-column gap-1">
        {% csrf_token %}
        <input type="text" name="space_token" class="form-control form-control-sm" placeholder="{% trans 'Invite Token' %}" required>
        <button class="btn btn-primary btn-sm flex-shrink-0" type="submit">{% trans 'Join' %}</button>
    </form>
    <form action="{% url 'space:create_space' %}" method="post" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">{% trans 'Create Space' %}</button>
    </form>
</div>
