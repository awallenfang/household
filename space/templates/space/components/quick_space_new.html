{% load static %}
{% load i18n %}

<!-- <div class="col gap-small p-1 maxh-40vh overflow-scroll"> -->

{% for space in user_spaces %}
<li class="dropdown-item">
    {% if selected_space.id == space.id %}
        <img src="{% static 'space/assets/door.svg' %}" alt="Selected Space" style="width: 1rem; height: 1rem;">
    {% else %}
        <img src="{% static 'space/assets/door.svg' %}" alt="Select Space" style="width: 1rem; height: 1rem; visibility:hidden;">
    {% endif %}
    <a class="btn btn-primary btn-sm"
    href="{% url 'space:select_space' space.id %}">{{space.name}}</a>
    <a href="{% url 'space:space_view' space.id %}">
        <img src="{% static 'space/assets/settings.svg' %}" alt="Settings">
    </a>
</li>

{% endfor %}


<li class="dropdown-item"><hr class="dropdown-divider"></li>
<form action="{% url 'space:join_space' %}" method="post" class="px-4 py-3 d-flex flex-column align-items-center row-gap-1">
        {% csrf_token %}
        <input type="text" name="space_token" class="form-control" placeholder="Invite Token" aria-label="Invite Token" required>
        <input class="btn btn-primary btn-sm" type="submit" value="{% trans 'Join Space' %}">

</form>
<li class="dropdown-item"><a href="{% url 'space:create_space' %}"  class="btn btn-primary btn-sm">{% trans 'Create Space' %}</a></li>
