{% load i18n %}

{% for space in user_spaces %}
<li class="dropdown-item d-flex align-items-center gap-2 py-1">
    <span class="d-inline-flex" style="width: 1.25rem; justify-content: center;">
        {% if selected_space.id == space.id %}
            <i class="bi bi-check-circle-fill text-success"></i>
        {% endif %}
    </span>
    <form action="{% url 'space:select_space' space.id %}" method="post" class="flex-grow-1 d-inline">
        {% csrf_token %}
        <button type="submit" class="text-decoration-none text-reset btn btn-link p-0 flex-grow-1 text-start">
            {{space.name}}
        </button>
    </form>
    <a href="{% url 'space:space_view' space.id %}" class="link-secondary">
        <i class="bi bi-gear-fill"></i>
    </a>
</li>
{% endfor %}

<li><hr class="dropdown-divider"></li>
<li class="px-3 py-2">
    <form action="{% url 'space:join_space' %}" method="post" class="d-flex gap-2">
        {% csrf_token %}
        <input type="text" name="space_token" class="form-control form-control-sm" placeholder="{% trans 'Invite Token' %}" required>
        <button class="btn btn-primary btn-sm flex-shrink-0" type="submit">{% trans 'Join' %}</button>
    </form>
</li>
<li>
    <form action="{% url 'space:create_space' %}" method="post" class="d-flex justify-content-center px-3 py-1">
        {% csrf_token %}
        <button type="submit" class="dropdown-item d-flex justify-content-center align-items-center gap-1 py-1">
            <i class="bi bi-plus-circle"></i>
            {% trans 'Create Space' %}
        </button>
    </form>
</li>
