{% load i18n %}
{% load crispy_forms_tags %}

<div class="container py-3">
    <div class="d-flex align-items-center gap-3 mb-4">
        <h2 class="fw-semibold mb-0">{% trans 'Space Settings' %}</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="{% url 'space:space_view' space.id %}" method="post" id="space-form">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-semibold">{% trans 'Space Name' %}</label>
                    {% crispy form %}
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">{% trans 'Invite Token' %}</label>
                    <div class="d-flex align-items-center gap-2">
                        <code id="invite-token" class="fs-5 bg-light px-3 py-1 rounded-2">{{ space.invite_token }}</code>
                        {% if space.owner == user %}
                        <button class="btn btn-outline-secondary btn-sm"
                            hx-post="{% url 'space:space_view' space.id %}?hxp=new_token"
                            hx-target="#invite-token"
                            hx-swap="innerHTML">
                            <i class="bi bi-arrow-clockwise me-1"></i>{% trans 'Reset' %}
                        </button>
                        {% endif %}
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold mb-2">{% trans 'Members' %}</label>
                    {% include "space/components/people_list.html" %}
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary px-4" form="space-form">
                        <i class="bi bi-check-lg me-1"></i>{% trans 'Save Changes' %}
                    </button>
                    {% if space.owner == user %}
                    <a class="btn btn-outline-danger px-4" href="{% url 'space:delete_space' space.id %}"
                       onclick="return confirm('{% trans 'Are you sure?' %}')">
                       <i class="bi bi-trash3 me-1"></i>{% trans 'Delete Space' %}
                    </a>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
</div>
