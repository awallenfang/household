{% load static %}
{% block content %}
<div class="p-1 background-light border-radius-1">

    <form action="{% url 'space:space_view' space.id %}" method="post" class="space-form" id="space-form">
        {% csrf_token %}
        <div class="flex-row flex-justify-center"><h2>Space Settings and Information</h2></div>
        <label for="space-name"><b>Name:</b></label>
        <input type="text" name="name" id="space-name" value="{{space.name}}">
        <div>
            <b>Invite Token: {{space.invite_token}}</b>
        </div>
    </form>
    
    {% include "space/components/people_list.html" %}
    {% if selected_space.owner == user%}
    <div class="flex-row flex-justify-center flex-gap-medium">
        <input class="button" type="submit" value="Save" form="space-form">
        <a class="button button-red" href="{% url 'space:delete_space' space.id%}" onclick="return confirm('Are you sure?')">DELETE SPACE</a>
    </div>
    {% endif %}
</div>
{% endblock %}
