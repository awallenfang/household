{% extends "hub/base.html" %}
{% load static %}
{% load i18n %}
{% block header %}{% endblock %}
{% block css_links %}
    <link rel="stylesheet" href="{% static 'hub/css/login.css' %}">
{% endblock %}
{% block content %}
<div class="auth-wrapper min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4 text-center">
            <h1 class="card-title h3 mb-4">{% trans 'Password changed!' %}</h1>
            <p class="mb-4">{% trans 'Your password has successfully been changed.' %}</p>
            <a href="{% url 'hub:dashboard' %}" class="btn btn-primary">
                <i class="bi bi-arrow-left me-1"></i>{% trans 'Return to page' %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
