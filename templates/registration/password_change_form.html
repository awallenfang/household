{%extends "hub/base.html" %}


{% load static%}
{% load i18n %}
{% block header %}
{% endblock %}

{% block css_links %}
    <link rel="stylesheet" href="{% static 'hub/css/login.css' %}">
{% endblock %}

{% block content %}
    <div id="login-container">
        <div id="login">
            <h1>{% trans 'Change password' %}</h1>
            <form method="post" id="login-form">
                {% csrf_token %}
                {%if error_message%}
                <p id="error-message">{{error_message}}</p>
                {%endif%}
                {{ form }}
                <button class="btn btn-primary" id="submit" type="submit">{% trans 'Submit' %}</button>
            </form>
        </div>
    </div>
{%endblock content%}
