{% extends "hub/base.html" %}
{% load static %}
{% load i18n %}
{% block header %}{% endblock %}
{% block css_links %}
    <link rel="stylesheet" href="{% static 'hub/css/login.css' %}">
{% endblock %}
{% block content %}
<div class="auth-wrapper min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4">
            <h1 class="card-title h3 mb-4 text-center">{% trans 'Reset password' %}</h1>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3 form-floating">
                    <input type="email" name="email" class="form-control" id="id_email" placeholder="email@example.com" required>
                    <label for="id_email">{% trans 'Email address' %}</label>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">
                    <i class="bi bi-envelope me-1"></i>{% trans 'Send reset link' %}
                </button>
            </form>
        </div>
        <div class="card-footer bg-transparent border-top-0 text-center pb-3">
            <p class="mb-0"><a href="{% url 'login' %}">{% trans 'Back to login' %}</a></p>
        </div>
    </div>
</div>
{% endblock %}
