{%load static%}
{% load i18n %}
<div class="card" todo-id="{{todo.id}}">
    <form action="{% url 'todos:edit_todo' todo.id %}" 
    method="post"
    hx-post="{% url 'todos:edit_todo' todo.id %}"
    hx-target="closest .card"
    hx-swap="outerHTML">
        {% csrf_token %}
        <div class="card-header d-flex justify-content-between align-items-center gap-2 flex-wrap">
            <div class="d-flex align-items-center gap-2 flex-grow-1">
                {{form.name}}
                {% if todo.schedule_state is not None%}
                    <img src="{% static 'todos/assets/refresh.svg' %}" class="opacity-50" style="height: 1rem;">
                {% endif %}
            </div>
            <div class="d-flex align-items-center gap-2">
                {% if todo.schedule_state is None%}
                    {{form.assigned_user}}
                {% endif %}
                <input type="submit" value="{% trans 'Save' %}" class="btn btn-primary btn-sm">
            </div>
        </div>
        <div class="collapse show" id="collapse-{{todo.id}}">
            <div class="d-flex flex-row justify-content-between p-3 gap-3">
                <div class="flex-grow-1">
                    {{form.description}}
                </div>
                <div class="d-flex flex-column align-items-center gap-1 flex-shrink-0" style="min-width: 8rem;">
                    <a class="btn btn-primary btn-sm w-100"
                    hx-delete="{% url 'todos:delete_todo' todo.id %}" 
                    hx-confirm="{% trans 'Are you sure you would like to delete this todo?' %}"
                    hx-target="#todo-block">{% trans 'Delete' %}</a>
                </div>
            </div>
        </div>
    </form>
</div>
